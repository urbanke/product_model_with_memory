[build-system]
requires = ["setuptools>=69", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "product-model-with-memory"
version = "0.1.0"
description = "A simple product model but for sources with memory."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mpmath",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "reportlab",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
